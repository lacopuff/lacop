name: Atualizar dados do Lattes

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1'

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar XMLs do Lattes
        id: check
        run: |
          count=$(find lattes/ -name "*.xml" -o -name "*.zip" 2>/dev/null | wc -l)
          echo "count=$count" >> $GITHUB_OUTPUT

      - name: Executar atualizador
        if: steps.check.outputs.count > 0
        run: python atualizar_lattes.py

      - name: Verificar mudancas
        id: changes
        run: |
          git diff --quiet data.js || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit das atualizacoes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Lattes Bot"
          git config user.email "bot@laboratorio"
          git add data.js projetos_lattes.js
          git commit -m "Atualizacao automatica via Lattes"
          git push

      - name: Sem mudancas
        if: steps.changes.outputs.changed != 'true'
        run: echo "Nenhuma mudanca detectada."
